name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: dddd4444/danoh-site

# The job only reads the repo; the registry push uses Docker Hub secrets,
# not GITHUB_TOKEN. Default token permissions are broader than that.
permissions:
  contents: read

# Actions are pinned to commit SHAs (tag comment alongside) so a moved or
# hijacked tag can't change what runs with the Docker Hub secrets. Refresh:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # NEXT_PUBLIC_* values are baked into the client bundle at build
          # time; the compose file's runtime env can't provide them. Unset
          # secrets pass through as empty and the client code no-ops.
          build-args: |
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
